services:
  postgres:
    image: postgres:16-alpine
    container_name: planshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: planshift
      POSTGRES_PASSWORD: planshift
      POSTGRES_DB: planshift
    ports:
      - "5432:5432"
    volumes:
      - planshift_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planshift -d planshift"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planshift_postgres:
